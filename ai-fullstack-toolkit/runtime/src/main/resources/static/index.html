<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Fullstack Toolkit</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><header><h1>AI Fullstack Toolkit</h1><p class="lede">One place to configure MCP, A2A, A2UI, and MCP Apps.</p></header><section class="layout"><aside><h2>REGISTERED TOOLS</h2><div id="tools"></div><button id="new-tool">+ CREATE</button><button id="database-check">DATABASE CHECK</button></aside><article><div class="status"><i></i> RUNTIME ONLINE <small id="selected"></small></div><h2 id="tool-title">Select a tool</h2><p id="tool-description"></p><div class="surfaces" id="surfaces"></div><h3>GENERATED OUTPUT</h3><div class="tabs"><button data-kind="mcp">MCP</button><button data-kind="a2a">A2A CARD</button><button data-kind="a2ui">A2UI</button><button data-kind="mcp-app">MCP APP</button></div><pre id="output">Loading...</pre></article></section></main><dialog id="editor"><form method="dialog"><h2>Create tool</h2><label>Tool ID<input id="id" value="shipment-status"></label><label>Description<textarea id="description">Find the current status of a shipment.</textarea></label><label><input type="checkbox" id="a2a" checked> A2A enabled</label><label><input type="checkbox" id="a2ui" checked> A2UI enabled</label><label><input type="checkbox" id="app" checked> MCP App enabled</label><menu><button value="cancel">CANCEL</button><button id="save" value="default">SAVE TO RUNTIME</button></menu></form></dialog><script src="/app.js"></script></body></html>
