<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="660" viewBox="0 0 1400 660" role="img" aria-labelledby="title desc">
<title id="title">Passwordless Access, End to End</title><desc id="desc">Separate workload authentication, database login, and end-user authorization. A passwordless workload can still be overprivileged. Identity, authorization, and lifecycle controls all matter.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#526572"/></marker></defs>
<rect width="1400" height="660" fill="#f5f7f8"/><rect width="1400" height="165" fill="#24383b"/>
<text x="48" y="46" fill="#f4b5a9" font-family="Arial,sans-serif" font-size="19" font-weight="bold">ORACLE AI DATABASE</text>
<text x="48" y="96" fill="white" font-family="Arial,sans-serif" font-size="36" font-weight="bold">Passwordless Access, End to End</text>
<text x="48" y="135" fill="#d9e4e6" font-family="Arial,sans-serif" font-size="21">Separate workload authentication, database login, and end-user authorization</text>
<rect x="48" y="222" width="402" height="273" rx="16" fill="white" stroke="#c8d3dc" stroke-width="2"/>
<rect x="48" y="222" width="402" height="7" fill="#c74634"/>
<text x="72" y="276" fill="#202a33" font-family="Arial,sans-serif" font-size="26" font-weight="bold">User and workload</text>
<text x="72" y="326" fill="#526572" font-family="Arial,sans-serif" font-size="21">User sign-in and MFA</text>
<text x="72" y="365" fill="#526572" font-family="Arial,sans-serif" font-size="21">Instance / resource principal</text>
<text x="72" y="404" fill="#526572" font-family="Arial,sans-serif" font-size="21">Managed or federated identity</text>
<text x="72" y="443" fill="#526572" font-family="Arial,sans-serif" font-size="21">Short-lived credentials</text>
<path d="M455,358 L491,358" stroke="#526572" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="498" y="222" width="402" height="273" rx="16" fill="white" stroke="#c8d3dc" stroke-width="2"/>
<rect x="498" y="222" width="402" height="7" fill="#c74634"/>
<text x="522" y="276" fill="#202a33" font-family="Arial,sans-serif" font-size="26" font-weight="bold">Application and driver</text>
<text x="522" y="326" fill="#526572" font-family="Arial,sans-serif" font-size="21">Validate issuer and audience</text>
<text x="522" y="365" fill="#526572" font-family="Arial,sans-serif" font-size="21">Obtain database-scoped token</text>
<text x="522" y="404" fill="#526572" font-family="Arial,sans-serif" font-size="21">Set request security context</text>
<text x="522" y="443" fill="#526572" font-family="Arial,sans-serif" font-size="21">Clear context on pool return</text>
<path d="M905,358 L941,358" stroke="#526572" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="948" y="222" width="402" height="273" rx="16" fill="white" stroke="#c8d3dc" stroke-width="2"/>
<rect x="948" y="222" width="402" height="7" fill="#c74634"/>
<text x="972" y="276" fill="#202a33" font-family="Arial,sans-serif" font-size="26" font-weight="bold">Oracle AI Database</text>
<text x="972" y="326" fill="#526572" font-family="Arial,sans-serif" font-size="21">TLS and identity validation</text>
<text x="972" y="365" fill="#526572" font-family="Arial,sans-serif" font-size="21">Session privileges</text>
<text x="972" y="404" fill="#526572" font-family="Arial,sans-serif" font-size="21">Deep Data Security policies</text>
<text x="972" y="443" fill="#526572" font-family="Arial,sans-serif" font-size="21">Audit user and application</text>
<text x="48" y="573" fill="#24383b" font-family="Arial,sans-serif" font-size="22">A passwordless workload can still be overprivileged. Identity, authorization, and lifecycle controls all matter.</text></svg>
